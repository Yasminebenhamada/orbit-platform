apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasks-api
  namespace: orbit
spec:
  ingressClassName: traefik
  rules:
  - host: tasks.orbit.local
    http:
      paths:
      - path: /api/tasks
        pathType: Prefix
        backend:
          service:
            name: tasks-api
            port:
              number: 8000

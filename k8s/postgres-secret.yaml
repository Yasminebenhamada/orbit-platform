# Note: Secrets should ideally be created directly in the cluster via:
#   kubectl create secret generic db-credentials --namespace orbit --from-literal=password=<your-password>
# Or managed with Sealed Secrets / Vault. Do not commit actual production secrets to Git.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: orbit
type: Opaque
stringData:
  # Example placeholder for local cluster experimentation:
  password: "CHANGE_ME_SECURE_PASSWORD"

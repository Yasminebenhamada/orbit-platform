{{/*
  This chart uses the "existingSecret" pattern: the DB password is never
  stored in values.yaml or in this chart. Instead it must be pre-created
  on the cluster before running helm install:

    kubectl create secret generic db-credentials \
      --namespace orbit \
      --from-literal=password=<your-db-password>

  The deployment mounts the password via secretKeyRef so it never appears
  in a ConfigMap, a log, or a Helm release history.
*/}}

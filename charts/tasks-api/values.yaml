replicaCount: 1

image:
  repository: ghcr.io/yasminebenhamada/orbit-platform/tasks-api
  pullPolicy: IfNotPresent
  tag: "5ecc8fdefec3906dc826582af39b183baff0d6ee"

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

config:
  serverPort: "8000"

database:
  host: postgresql
  port: 5432
  name: orbit
  user: orbit
  existingSecret: db-credentials

internsApi:
  url: "http://interns-api:8080"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# tasks-api exposes dedicated liveness and readiness endpoints in main.py.
# Using the split paths matches what Kubernetes expects from each probe type.
livenessProbe:
  enabled: true
  path: /health/live
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  path: /health/ready
  initialDelaySeconds: 10
  periodSeconds: 5

configMap:
  enabled: true

ingress:
  enabled: true
  className: traefik
  host: tasks.orbit.local
  path: /api/tasks
  pathType: Prefix

name: CI - tasks-api

on:
  push:
    branches: [main]
    paths:
      - 'services/tasks-api/**'
      - 'charts/tasks-api/**'
  pull_request:
    paths:
      - 'services/tasks-api/**'

env:
  IMAGE: ghcr.io/${{ github.repository }}/tasks-api

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: services/tasks-api

      - name: Lint with ruff
        run: ruff check .
        working-directory: services/tasks-api

      - name: Run tests with coverage
        run: pytest --cov=app
        working-directory: services/tasks-api

  build-and-publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/tasks-api
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}/tasks-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.REPO_LOWER }}/tasks-api:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Update image tag in chart
        run: |
          sed -i 's|tag: .*|tag: "${{ github.sha }}"|' charts/tasks-api/values.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "ci: bump tasks-api image to ${{ github.sha }} [skip ci]" || true
          git push
